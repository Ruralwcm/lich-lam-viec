<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lịch Làm Việc v4.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#d71920;--navy:#1a3c6e;--gold:#ffc107;--green:#1e8e4e;--orange:#f59e0b;
  --bg:#f4f6fb;--card:#fff;--line:#e5e9f2;--txt:#1c2434;--mut:#6b7280;
  --daotao:#1e8e4e;--thitruong:#f59e0b;--hopteam:#1a3c6e;--khac:#6b7280;
  --priority-glow:rgba(215,25,32,.25);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;}

/* HEADER */
.header{background:linear-gradient(135deg,var(--navy),#2c4a8a);color:#fff;padding:12px 16px;box-shadow:0 2px 12px rgba(26,60,110,.2);display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;}
.header img.logo{height:26px;object-fit:contain;}
.header h1{font-size:16px;font-weight:800;flex:1;letter-spacing:0;}
.header .ver{background:rgba(255,255,255,.2);padding:4px 10px;border-radius:12px;font-size:11px;font-weight:600;}

/* USER SELECT BAR */
.user-bar{display:flex;gap:8px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:52px;z-index:99;align-items:center;flex-wrap:wrap;}
.user-bar select,.user-bar button{padding:8px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);font-size:13px;font-family:inherit;color:var(--txt);}
.user-bar button{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600;cursor:pointer;}
.user-bar select:focus{border-color:var(--navy);outline:none;}

/* VIEW TOGGLE */
.view-toggle{display:flex;gap:6px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:96px;z-index:98;}
.view-toggle button{flex:1;padding:9px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--mut);font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;max-width:120px;}
.view-toggle button.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.view-toggle .act-bar{display:flex;gap:6px;margin-left:auto;}
.view-toggle .act-bar button{padding:9px 14px;font-size:12px;}

/* MAIN LAYOUT */
.main-layout{display:flex;min-height:calc(100vh - 150px);}
.calendar-main{flex:1;min-width:0;}
.sidebar{display:none;background:var(--card);border-left:1px solid var(--line);overflow-y:auto;}
@media(min-width:768px){
  .calendar-main{flex:0 0 68%;}
  .sidebar{display:block;width:32%;padding:16px;}
  .header{padding:14px 24px;}
  .user-bar{padding:10px 24px;top:56px;}
  .view-toggle{padding:10px 24px;top:100px;}
  .header h1{font-size:18px;}
}

/* ===== MONTH VIEW ===== */
.month-container{padding:16px;}
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.month-nav h2{font-size:17px;font-weight:800;color:var(--navy);}
.month-nav button{width:36px;height:36px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--navy);}
.month-nav button:hover{background:var(--navy);color:#fff;}
.month-dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;font-weight:700;color:var(--mut);padding:6px 0;}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:var(--line);border:2px solid var(--line);border-radius:10px;overflow:hidden;}
.month-cell{background:var(--card);min-height:90px;padding:6px;cursor:pointer;transition:background .15s;position:relative;}
.month-cell:hover{background:#f0f3fb;}
.month-cell.other{opacity:.35;}
.month-cell.today{border:2px solid var(--red);box-shadow:inset 0 0 0 0 var(--red);z-index:1;}
.month-cell .day-num{font-weight:700;font-size:13px;color:var(--navy);margin-bottom:3px;}
.month-cell.today .day-num{background:var(--red);color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;}
.month-badge{display:block;padding:2px 6px;border-radius:4px;font-size:9.5px;font-weight:600;margin:1px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff;cursor:pointer;}
.month-badge.type-daotao{background:var(--daotao);}
.month-badge.type-thitruong{background:var(--thitruong);}
.month-badge.type-hop{background:var(--hopteam);}
.month-badge.type-khac{background:var(--mut);}
.month-badge.priority{border-left:3px solid var(--red);box-shadow:0 0 4px var(--priority-glow);}
.month-cell .more{font-size:10px;color:var(--mut);text-align:center;cursor:pointer;}
@media(min-width:768px){
  .month-cell{min-height:110px;padding:8px;}
  .month-cell .day-num{font-size:14px;}
  .month-badge{font-size:10.5px;padding:3px 7px;}
}

/* ===== WEEK VIEW (Hourly Grid) ===== */
.week-container{padding:16px;}
.week-header{display:grid;grid-template-columns:50px repeat(7,1fr);gap:2px;margin-bottom:2px;}
.week-header .time-label{font-size:10px;color:var(--mut);text-align:center;}
.week-header .day-col{text-align:center;padding:8px 2px;background:var(--card);border-radius:6px;font-weight:700;font-size:12px;cursor:pointer;}
.week-header .day-col.today{background:var(--red);color:#fff;}
.week-header .day-date{font-size:10px;font-weight:400;opacity:.7;display:block;}
.week-grid-scroll{max-height:70vh;overflow-y:auto;}
.week-grid{display:grid;grid-template-columns:50px repeat(7,1fr);gap:1px;background:var(--line);min-height:960px;}
.week-grid .hour-label{font-size:10px;color:var(--mut);text-align:right;padding:0 4px;background:var(--card);height:60px;line-height:60px;border-right:1px solid var(--line);}
.week-grid .hour-cell{background:var(--card);height:60px;position:relative;cursor:pointer;}
.week-grid .hour-cell:hover{background:#f0f3fb;}
.week-event{position:absolute;left:2px;right:2px;border-radius:4px;padding:4px 6px;font-size:10px;color:#fff;font-weight:600;overflow:hidden;cursor:pointer;z-index:2;min-height:20px;}
.week-event.type-daotao{background:var(--daotao);}
.week-event.type-thitruong{background:var(--thitruong);}
.week-event.type-hop{background:var(--hopteam);}
.week-event.type-khac{background:var(--mut);}
.week-event.priority{border-left:3px solid var(--red);box-shadow:0 0 6px var(--priority-glow);}
.week-event .ev-title{font-size:9.5px;line-height:1.2;overflow:hidden;}
.week-event .ev-time{font-size:8.5px;opacity:.8;}
@media(min-width:768px){
  .week-container{padding:20px;}
  .week-header .day-col{font-size:13px;padding:10px 4px;}
  .week-grid .hour-cell{height:64px;}
  .week-grid .hour-label{height:64px;line-height:64px;}
  .week-event{font-size:11px;padding:5px 8px;}
}

/* ===== LIST VIEW ===== */
.list-container{padding:16px;}
.list-day-header{font-weight:800;font-size:14px;color:var(--navy);padding:12px 0 4px;border-bottom:2px solid var(--line);margin-bottom:6px;}
.list-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border-radius:8px;margin:4px 0;border:1px solid var(--line);cursor:pointer;transition:.15s;}
.list-item:hover{box-shadow:0 2px 8px rgba(0,0,0,.08);}
.list-item.priority{border-left:4px solid var(--red);}
.list-item .l-color{width:6px;height:40px;border-radius:3px;flex-shrink:0;}
.list-item .l-color.daotao{background:var(--daotao);}
.list-item .l-color.thitruong{background:var(--thitruong);}
.list-item .l-color.hop{background:var(--hopteam);}
.list-item .l-color.khac{background:var(--mut);}
.list-item .l-info{flex:1;min-width:0;}
.list-item .l-title{font-weight:600;font-size:13px;}
.list-item .l-meta{font-size:11px;color:var(--mut);}
.list-item .l-status{font-size:18px;cursor:pointer;padding:4px;}

/* ===== SIDEBAR ===== */
.sidebar h3{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:10px;}
.side-people{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.side-person{padding:5px 10px;background:var(--bg);border-radius:6px;font-size:11px;cursor:pointer;border:1.5px solid var(--line);}
.side-person.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.side-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.side-stat{background:var(--bg);border-radius:8px;padding:10px;text-align:center;}
.side-stat .num{font-size:22px;font-weight:800;color:var(--navy);}
.side-stat .lab{font-size:10px;color:var(--mut);margin-top:2px;}
.side-task-detail{font-size:12px;background:var(--bg);border-radius:8px;padding:10px;min-height:60px;color:var(--mut);}

/* ===== MODAL ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.show{display:flex;}
.modal-box{background:var(--card);border-radius:14px;padding:20px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 16px 48px rgba(0,0,0,.2);}
.modal-box h3{font-size:16px;font-weight:800;color:var(--navy);margin-bottom:14px;}
.modal-box label{font-size:11px;font-weight:600;color:var(--mut);display:block;margin:10px 0 4px;}
.modal-box input,.modal-box select,.modal-box textarea{width:100%;font-size:14px;font-family:inherit;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--txt);outline:none;}
.modal-box input:focus,.modal-box select:focus{border-color:var(--navy);}
.modal-box .row{display:flex;gap:8px;}
.modal-box .row>div{flex:1;}
.modal-box .chk-row{display:flex;align-items:center;gap:8px;margin:10px 0;}
.modal-box .chk-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--red);}
.modal-box .chk-row label{color:var(--txt);font-weight:700;font-size:13px;margin:0;cursor:pointer;}
.modal-box .btn-row{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;}
.modal-box .btn-row button{padding:10px 20px;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.modal-box .btn-save{background:var(--red);color:#fff;}
.modal-box .btn-cancel{background:var(--bg);color:var(--mut);border:1.5px solid var(--line);}
.store-dropdown{position:absolute;top:100%;left:0;right:0;max-height:180px;overflow-y:auto;background:var(--card);border:1.5px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.12);z-index:10;display:none;}
.store-dropdown.show{display:block;}
.store-opt{padding:9px 12px;font-size:12px;cursor:pointer;border-bottom:1px solid var(--line);}
.store-opt:hover{background:var(--bg);}
.store-search-wrap{position:relative;}
.no-result{padding:12px;text-align:center;font-size:12px;color:var(--mut);}

/* ===== DASHBOARD OVERLAY ===== */
.dash-overlay{position:fixed;inset:0;background:var(--bg);z-index:300;display:none;overflow-y:auto;padding:16px;}
.dash-overlay.show{display:block;}
.dash-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.dash-header h2{font-size:18px;font-weight:800;color:var(--navy);}
.dash-close{width:32px;height:32px;border-radius:50%;border:none;background:var(--card);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--line);}
.dash-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.dash-filters select,.dash-filters button{padding:8px 12px;border:1.5px solid var(--line);border-radius:8px;font-size:12px;font-family:inherit;background:var(--bg);}
.dash-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px;}
.dash-kpi .kpi-card{background:var(--card);border-radius:10px;padding:14px;text-align:center;border:1px solid var(--line);}
.dash-kpi .kpi-val{font-size:24px;font-weight:800;color:var(--navy);}
.dash-kpi .kpi-lab{font-size:11px;color:var(--mut);margin-top:4px;}
.dash-kpi .kpi-delta{font-size:11px;font-weight:600;}
.dash-kpi .kpi-delta.up{color:var(--green);}
.dash-kpi .kpi-delta.down{color:var(--red);}
.dash-bar{background:var(--card);border-radius:10px;padding:14px;margin-bottom:12px;border:1px solid var(--line);}
.dash-bar h4{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:10px;}
.bar-row{display:flex;align-items:center;gap:8px;margin:6px 0;}
.bar-label{width:140px;font-size:11px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0;}
.bar-track{flex:1;height:20px;background:var(--bg);border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;transition:width .3s;}
.bar-fill.green{background:var(--green);}
.bar-fill.orange{background:var(--orange);}
.bar-fill.red{background:var(--red);}
.bar-fill.navy{background:var(--navy);}
.bar-val{font-size:11px;width:40px;font-weight:600;flex-shrink:0;}
.dash-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px;}
.dash-table th{text-align:left;padding:8px;font-weight:700;background:var(--bg);color:var(--mut);border-bottom:2px solid var(--line);}
.dash-table td{padding:8px;border-bottom:1px solid var(--line);}
.dash-export{text-align:right;margin-top:10px;}

/* Footer */
.footer-bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:8px 16px;display:flex;gap:10px;justify-content:center;z-index:101;}
.footer-bar button{padding:10px 18px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--navy);}
.footer-bar button.primary{background:var(--red);color:#fff;border-color:var(--red);}

/* Utility */
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#1c2434;color:#fff;padding:10px 22px;border-radius:20px;font-size:14px;z-index:400;opacity:0;transition:opacity .3s;pointer-events:none;}
.toast.show{opacity:1;}
.toast.error{background:var(--red);}
.hidden{display:none!important;}
@media(min-width:768px){
  .dash-overlay{padding:24px 40px;}
  .dash-kpi{grid-template-columns:repeat(4,1fr);}
  .footer-bar{padding:10px 24px;}
}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <img class="logo" src="data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"%3E%3Ccircle cx="20" cy="20" r="18" fill="%23d71920"/%3E%3Ctext x="20" y="27" text-anchor="middle" fill="white" font-size="22" font-weight="bold" font-family="Arial"%3EW%3C/text%3E%3C/svg%3E" alt="WM">
  <h1>Lịch Làm Việc</h1>
  <span class="ver">v4.0</span>
</div>

<!-- User Bar -->
<div class="user-bar" id="userBar">
  <select id="vaiTro" onchange="onVaiTroChange()">
    <option value="">-- Vai trò --</option>
    <option value="GĐV">GĐV</option>
    <option value="GĐM">GĐM</option>
  </select>
  <select id="hoTen">
    <option value="">-- Chọn người --</option>
  </select>
</div>

<!-- View Toggle -->
<div class="view-toggle" id="viewToggle">
  <button id="btnMonth" class="active" onclick="switchView('month')">📅 Tháng</button>
  <button id="btnWeek" onclick="switchView('week')">🕐 Tuần</button>
  <button id="btnList" onclick="switchView('list')">📋 Danh sách</button>
  <div class="act-bar">
    <button onclick="copyPrevWeek()" title="Copy tuần trước">📋 Copy</button>
    <button onclick="goToToday()">📍 Hôm nay</button>
  </div>
</div>

<!-- Main Layout -->
<div class="main-layout">
  <!-- Calendar Area -->
  <div class="calendar-main" id="calendarMain"></div>

  <!-- Sidebar (PC) -->
  <div class="sidebar" id="sidebar">
    <h3>📊 Tổng quan</h3>
    <div class="side-people" id="sidePeople"></div>
    <div class="side-stats" id="sideStats"></div>
    <h3>👆 Chọn task để xem</h3>
    <div class="side-task-detail" id="sideTaskDetail">Chọn một task để xem chi tiết</div>
  </div>
</div>

<!-- Task Modal -->
<div class="modal-overlay" id="taskModal">
  <div class="modal-box">
    <h3 id="modalTitle">➕ Thêm công việc</h3>
    <label>Loại công việc</label>
    <select id="modalTaskType" onchange="onTaskTypeChange()">
      <option value="">-- Chọn loại --</option>
      <option value="Họp team">Họp team</option>
      <option value="Kiểm tra CH">Kiểm tra CH / Đi thị trường</option>
      <option value="Đào tạo">Đào tạo</option>
      <option value="Tuyển dụng">Tuyển dụng</option>
      <option value="Báo cáo">Báo cáo</option>
      <option value="Khảo sát NSO">Khảo sát NSO</option>
      <option value="Khác">Khác (tự nhập)</option>
    </select>
    <div id="customTaskWrap" class="hidden">
      <label>Mô tả</label>
      <input type="text" id="modalTaskCustom" placeholder="Nhập mô tả công việc...">
    </div>
    <label>Giờ</label>
    <div class="row">
      <div><input type="time" id="modalTimeStart" value="08:00"></div>
      <div><input type="time" id="modalTimeEnd" value="09:30"></div>
    </div>
    <label>Cửa hàng (nếu có)</label>
    <div class="store-search-wrap">
      <input type="text" id="modalStoreSearch" placeholder="Tìm mã hoặc tên CH..." autocomplete="off">
      <div class="store-dropdown" id="modalStoreDropdown"></div>
    </div>
    <input type="hidden" id="modalMaCH">
    <input type="hidden" id="modalTenCH">
    <label>Ghi chú</label>
    <textarea id="modalGhiChu" rows="2" placeholder="Ghi chú thêm..."></textarea>
    <div class="chk-row">
      <input type="checkbox" id="modalPriority">
      <label for="modalPriority">⭐️ Việc trọng tâm</label>
    </div>
    <input type="hidden" id="modalTaskId">
    <input type="hidden" id="modalEditDay">
    <div class="btn-row">
      <button class="btn-cancel" onclick="closeTaskModal()">Hủy</button>
      <button class="btn-save" onclick="saveTask()">💾 Lưu</button>
    </div>
  </div>
</div>

<!-- Dashboard Overlay -->
<div class="dash-overlay" id="dashOverlay">
  <div class="dash-header">
    <h2>📊 Dashboard</h2>
    <button class="dash-close" onclick="closeDashboard()">✕</button>
  </div>
  <div class="dash-filters">
    <select id="dashVaiTro"><option value="">Tất cả vai trò</option><option value="GĐV">GĐV</option><option value="GĐM">GĐM</option></select>
    <select id="dashNam"></select>
    <select id="dashTuan" onchange="loadDashboard()"><option value="">Tất cả tuần</option></select>
    <button onclick="loadDashboard()">🔍 Xem</button>
    <button onclick="exportCSV()" style="margin-left:auto;">📥 Xuất CSV</button>
  </div>
  <div class="dash-kpi" id="dashKpi"></div>
  <div class="dash-bar" id="dashBars"></div>
  <div id="dashTopTable"></div>
</div>

<!-- Footer -->
<div class="footer-bar">
  <button onclick="loadTestData()">🧪 Demo</button>
  <button onclick="openDashboard()">📊 Dashboard</button>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>

// ========== CONFIG ==========
var GAS_URL = 'https://script.google.com/macros/s/AKfycbwPmh_Erk9eDbpNCMQePscfl067merQamb1xfvKbtjyUmjw3jTUU4Z43LzziuQb7H1X/exec';
var DAY_KEYS = ['T2','T3','T4','T5','T6','T7','CN'];
var DAY_LABELS = ['Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7','Chủ Nhật'];
var DOW_LABELS = ['T2','T3','T4','T5','T6','T7','CN'];
var storelistCache = [], GDV_LIST = [];
var currentView = 'month';
var currentMonth = new Date().getMonth(); // 0-based
var currentYear = new Date().getFullYear();
var currentWeekYear = currentYear;
var currentWeekNum = getISOWeekNumber(new Date());
var allTasks = {}; // { 'T2': [...tasks], 'T3': [...] }
var TASK_COLORS = {
  'Đào tạo': 'daotao', 'Kiểm tra CH': 'thitruong', 'Đi thị trường': 'thitruong',
  'Họp team': 'hop', 'Tuyển dụng': 'khac', 'Báo cáo': 'khac',
  'Khảo sát NSO': 'khac', 'Khác': 'khac'
};

// ========== INIT ==========
document.addEventListener('DOMContentLoaded', function(){
  loadGdvList();
  loadStorelist(true);
  initStoreSearch();
  initDashboardMonthSelects();
  switchView('month');
});

// ========== VIEW SWITCHING ==========
function switchView(view) {
  currentView = view;
  document.querySelectorAll('.view-toggle button').forEach(function(b){b.classList.remove('active');});
  var btnMap = {month:'btnMonth', week:'btnWeek', list:'btnList'};
  var btn = document.getElementById(btnMap[view]);
  if (btn) btn.classList.add('active');
  loadScheduleForView();
}

function loadScheduleForView() {
  var hoTen = document.getElementById('hoTen').value.trim();
  var vaiTro = document.getElementById('vaiTro').value;
  if (!hoTen || !vaiTro) {
    document.getElementById('calendarMain').innerHTML = '<div style="padding:40px;text-align:center;color:var(--mut)">👆 Chọn vai trò và tên ở trên để bắt đầu</div>';
    return;
  }
  fetchGAS('getSchedule', {ho_ten: hoTen, vai_tro: vaiTro, nam: currentView==='month'?currentYear:currentWeekYear})
    .then(function(tasks){
      // Group tasks by day
      allTasks = {};
      DAY_KEYS.forEach(function(dk){allTasks[dk]=[];});
      (tasks||[]).forEach(function(t){
        // For month view, match by week
        if (currentView==='month'){
          var tDate = isoWeekToDate(t.nam, t.tuan, DAY_KEYS.indexOf(t.ngay));
          if (tDate && tDate.getMonth()===currentMonth && tDate.getFullYear()===currentYear){
            if (!allTasks[t.ngay]) allTasks[t.ngay] = [];
            allTasks[t.ngay].push(t);
          }
        } else {
          if (String(t.tuan)===String(currentWeekNum) && t.nam===currentWeekYear){
            allTasks[t.ngay].push(t);
          }
        }
      });
      // Load extended data from localStorage
      Object.keys(allTasks).forEach(function(dk){
        allTasks[dk].forEach(function(t){
          t.priority = localStorage.getItem('task_priority_'+t.id)==='true';
          t.status = localStorage.getItem('task_status_'+t.id)||'pending';
          t.timeStart = localStorage.getItem('task_timeStart_'+t.id)||'08:00';
          t.timeEnd = localStorage.getItem('task_timeEnd_'+t.id)||'09:30';
        });
        // Sort: priority first
        allTasks[dk].sort(function(a,b){
          if (a.priority && !b.priority) return -1;
          if (!a.priority && b.priority) return 1;
          return (a.timeStart||'08:00').localeCompare(b.timeStart||'08:00');
        });
      });
      renderCurrentView();
      updateSidebar();
    });
}

function renderCurrentView() {
  if (currentView==='month') renderMonthView();
  else if (currentView==='week') renderWeekView();
  else renderListView();
}

// ========== MONTH VIEW ==========
function renderMonthView() {
  var m = currentMonth, y = currentYear;
  var firstDay = new Date(y,m,1);
  var lastDay = new Date(y,m+1,0);
  var startDow = (firstDay.getDay()+6)%7; // Mon=0
  var totalCells = startDow + lastDay.getDate();
  var rows = Math.ceil(totalCells/7);
  var today = new Date();

  // Build month grid
  var h = '<div class="month-container">';
  h += '<div class="month-nav">';
  h += '<button onclick="prevMonth()">◀</button>';
  h += '<h2>Tháng '+(m+1)+'/'+y+'</h2>';
  h += '<button onclick="nextMonth()">▶</button>';
  h += '</div>';
  h += '<div class="month-dow">';
  DOW_LABELS.forEach(function(d){h+='<div>'+d+'</div>';});
  h += '</div><div class="month-grid">';

  for (var i=0; i<rows*7; i++) {
    var dayNum = i - startDow + 1;
    var isOther = dayNum<1 || dayNum>lastDay.getDate();
    var cellDate = new Date(y,m,dayNum);
    var dk = DAY_KEYS[(i%7)];
    var isToday = cellDate.toDateString()===today.toDateString();

    h += '<div class="month-cell'+(isOther?' other':'')+(isToday?' today':'')+'" onclick="onCellClick(\''+dk+'\','+dayNum+','+m+','+y+')">';
    if (!isOther) {
      h += '<div class="day-num">'+dayNum+'</div>';
      var tasks = allTasks[dk]||[];
      tasks.forEach(function(t,idx){
        if (idx<3){
          var cls = getTypeClass(t.task_type);
          var isPri = t.priority || (t.task_type==='Đào tạo' || t.task_type==='Kiểm tra CH');
          h += '<div class="month-badge type-'+cls+(isPri?' priority':'')+'" onclick="event.stopPropagation();showTaskDetail(\''+t.id+'\')" title="'+(t.task_custom||t.task_type)+'">'+(t.task_custom||t.task_type).substring(0,15)+'</div>';
        } else if (idx===3) {
          h += '<div class="more" onclick="event.stopPropagation();switchView(\'list\')">+'+(tasks.length-3)+' thêm</div>';
        }
      });
    }
    h += '</div>';
  }
  h += '</div></div>';
  document.getElementById('calendarMain').innerHTML = h;
}

function prevMonth() {
  if (currentMonth===0){currentMonth=11;currentYear--;}
  else currentMonth--;
  loadScheduleForView();
}
function nextMonth() {
  if (currentMonth===11){currentMonth=0;currentYear++;}
  else currentMonth++;
  loadScheduleForView();
}

// ========== WEEK VIEW ==========
function renderWeekView() {
  var dates = getISOWeekDates(currentWeekYear, currentWeekNum);
  var today = new Date();
  var h = '<div class="week-container">';
  h += '<div class="month-nav"><button onclick="prevWeek()">◀</button>';
  h += '<h2>Tuần '+currentWeekNum+' ('+formatDate(dates.start)+' - '+formatDate(dates.end)+')</h2>';
  h += '<button onclick="nextWeek()">▶</button></div>';

  // Day headers
  h += '<div class="week-header"><div class="time-label"></div>';
  var curDate = new Date(dates.start);
  for (var d=0; d<7; d++) {
    var isToday = curDate.toDateString()===today.toDateString();
    h += '<div class="day-col'+(isToday?' today':'')+'" onclick="onDayClick(\''+DAY_KEYS[d]+'\')">'+DAY_LABELS[d]+'<span class="day-date">'+curDate.getDate()+'/'+(curDate.getMonth()+1)+'</span></div>';
    curDate.setDate(curDate.getDate()+1);
  }
  h += '</div>';

  // Hour grid
  h += '<div class="week-grid-scroll"><div class="week-grid">';
  for (var hr=6; hr<=22; hr++) {
    h += '<div class="hour-label">'+(hr<10?'0':'')+hr+':00</div>';
    for (var d=0; d<7; d++) {
      var dk = DAY_KEYS[d];
      h += '<div class="hour-cell" onclick="onHourClick(\''+dk+'\','+hr+')">';
      var tasks = allTasks[dk]||[];
      tasks.forEach(function(t){
        var sh = parseInt((t.timeStart||'08:00').split(':')[0])||8;
        var sm = parseInt((t.timeStart||'08:00').split(':')[1])||0;
        var eh = parseInt((t.timeEnd||'09:30').split(':')[0])||9;
        var em = parseInt((t.timeEnd||'09:30').split(':')[1])||0;
        var tStart = sh*60+sm, tEnd = eh*60+em;
        if (hr*60 <= tStart && tStart < (hr+1)*60) {
          var top = ((tStart%60)/60)*60;
          var hpx = Math.max(((tEnd-tStart)/60)*60, 20);
          var cls = getTypeClass(t.task_type);
          h += '<div class="week-event type-'+cls+(t.priority?' priority':'')+'" style="top:'+top+'px;height:'+hpx+'px" onclick="event.stopPropagation();showTaskDetail(\''+t.id+'\')" title="'+(t.task_custom||t.task_type)+'"><span class="ev-time">'+t.timeStart+'-'+t.timeEnd+'</span><br><span class="ev-title">'+(t.task_custom||t.task_type).substring(0,12)+'</span></div>';
        }
      });
      h += '</div>';
    }
  }
  h += '</div></div></div>';
  document.getElementById('calendarMain').innerHTML = h;
}

function prevWeek() { currentWeekNum--; if(currentWeekNum<1){currentWeekYear--;currentWeekNum=52;} loadScheduleForView(); }
function nextWeek() { currentWeekNum++; if(currentWeekNum>52){currentWeekYear++;currentWeekNum=1;} loadScheduleForView(); }

// ========== LIST VIEW ==========
function renderListView() {
  var h = '<div class="list-container">';
  DAY_KEYS.forEach(function(dk, i){
    var tasks = allTasks[dk]||[];
    if (tasks.length===0 && currentView!=='list') return;
    h += '<div class="list-day-header">'+DAY_LABELS[i]+' ('+tasks.length+' việc)</div>';
    if (tasks.length===0) h += '<div style="color:var(--mut);font-size:12px;padding:8px 0">Không có việc</div>';
    tasks.forEach(function(t){
      var cls = getTypeClass(t.task_type);
      var statusIcon = {pending:'⬜',done:'✅',cancelled:'❌'}[t.status]||'⬜';
      h += '<div class="list-item'+(t.priority?' priority':'')+'">';
      h += '<div class="l-color '+cls+'"></div>';
      h += '<div class="l-info">';
      h += '<div class="l-title">'+(t.priority?'⭐️ ':'')+(t.task_custom||t.task_type)+' <span style="font-size:10px;color:var(--mut)">'+(t.timeStart||'')+'-'+(t.timeEnd||'')+'</span></div>';
      h += '<div class="l-meta">'+(t.ma_ch?t.ma_ch+' - '+t.ten_ch:'')+(t.ghi_chu?' • '+t.ghi_chu:'')+'</div>';
      h += '</div>';
      h += '<div class="l-status" onclick="event.stopPropagation();cycleStatus(\''+t.id+'\')">'+statusIcon+'</div>';
      h += '</div>';
    });
  });
  h += '</div>';
  document.getElementById('calendarMain').innerHTML = h;
}

// ========== CELL CLICK HANDLERS ==========
function onCellClick(dk, dayNum, m, y) {
  var d = new Date(y,m,dayNum);
  currentWeekNum = getISOWeekNumber(d);
  currentWeekYear = d.getFullYear();
  openTaskModal(dk, null, '08:00');
}
function onHourClick(dk, hr) {
  var timeStr = (hr<10?'0':'')+hr+':00';
  openTaskModal(dk, null, timeStr);
}
function onDayClick(dk) { openTaskModal(dk, null, '08:00'); }

// ========== MODAL ==========
function openTaskModal(dk, taskId, defaultTime) {
  document.getElementById('modalEditDay').value = dk;
  document.getElementById('modalTaskId').value = taskId||'';
  document.getElementById('modalTimeStart').value = defaultTime||'08:00';
  document.getElementById('modalTimeEnd').value = '09:30';
  document.getElementById('modalPriority').checked = false;
  document.getElementById('customTaskWrap').classList.add('hidden');
  document.getElementById('modalTaskCustom').value = '';

  if (taskId) {
    var tasks = allTasks[dk]||[];
    var task = tasks.find(function(t){return t.id===taskId;});
    if (task) {
      document.getElementById('modalTitle').textContent = '✏️ Sửa - '+DAY_LABELS[DAY_KEYS.indexOf(dk)];
      document.getElementById('modalTaskType').value = task.task_type||'';
      document.getElementById('modalTaskCustom').value = task.task_custom||'';
      document.getElementById('modalStoreSearch').value = task.ma_ch?task.ma_ch+' - '+task.ten_ch:'';
      document.getElementById('modalMaCH').value = task.ma_ch||'';
      document.getElementById('modalTenCH').value = task.ten_ch||'';
      document.getElementById('modalGhiChu').value = task.ghi_chu||'';
      document.getElementById('modalTimeStart').value = task.timeStart||'08:00';
      document.getElementById('modalTimeEnd').value = task.timeEnd||'09:30';
      document.getElementById('modalPriority').checked = task.priority||false;
      if (task.task_type==='Khác') {
        document.getElementById('customTaskWrap').classList.remove('hidden');
      }
    }
  } else {
    document.getElementById('modalTitle').textContent = '➕ Thêm - '+DAY_LABELS[DAY_KEYS.indexOf(dk)];
    document.getElementById('modalTaskType').value = '';
    document.getElementById('modalStoreSearch').value = '';
    document.getElementById('modalMaCH').value = '';
    document.getElementById('modalTenCH').value = '';
    document.getElementById('modalGhiChu').value = '';
  }
  document.getElementById('modalStoreDropdown').classList.remove('show');
  document.getElementById('taskModal').classList.add('show');
}

function closeTaskModal() {
  document.getElementById('taskModal').classList.remove('show');
}

function onTaskTypeChange() {
  var val = document.getElementById('modalTaskType').value;
  document.getElementById('customTaskWrap').classList.toggle('hidden', val!=='Khác');
}

function saveTask() {
  var dk = document.getElementById('modalEditDay').value;
  var type = document.getElementById('modalTaskType').value;
  var custom = document.getElementById('modalTaskCustom').value.trim();
  var ma = document.getElementById('modalMaCH').value.trim();
  var ten = document.getElementById('modalTenCH').value.trim();
  var ghiChu = document.getElementById('modalGhiChu').value.trim();
  var taskId = document.getElementById('modalTaskId').value;
  var timeS = document.getElementById('modalTimeStart').value;
  var timeE = document.getElementById('modalTimeEnd').value;
  var priority = document.getElementById('modalPriority').checked;
  var hoTen = document.getElementById('hoTen').value.trim();
  var vaiTro = document.getElementById('vaiTro').value;

  if (!type) { showToast('Vui lòng chọn loại công việc','error'); return; }
  if (type==='Khác' && !custom) { showToast('Vui lòng mô tả công việc','error'); return; }

  var task = {
    id: taskId||('task_'+Date.now()+'_'+Math.random().toString(36).substr(2,6)),
    task_type: type,
    task_custom: type==='Khác'?custom:'',
    ma_ch: ma, ten_ch: ten, ghi_chu: ghiChu,
    ho_ten: hoTen, vai_tro: vaiTro,
    nam: currentView==='month'?currentYear:currentWeekYear,
    tuan: currentWeekNum, ngay: dk,
    priority: priority, timeStart: timeS, timeEnd: timeE, status: 'pending'
  };

  // Save to localStorage first
  localStorage.setItem('task_priority_'+task.id, String(priority));
  localStorage.setItem('task_timeStart_'+task.id, timeS);
  localStorage.setItem('task_timeEnd_'+task.id, timeE);
  localStorage.setItem('task_status_'+task.id, task.status);

  // Save to GAS (one task at a time)
  showLoading(true);
  fetchGAS('saveSchedule', {tasks:[task]})
    .then(function(r){
      if (r && r.success) {
        closeTaskModal();
        loadScheduleForView();
        showToast('✅ Đã lưu', 'success');
      } else {
        showToast('❌ Lỗi: '+(r?r.error:'Không xác định'), 'error');
      }
    })
    .catch(function(e){showToast('❌ Lỗi kết nối','error');})
    .finally(function(){showLoading(false);});
}

// ========== STATUS ==========
function cycleStatus(taskId) {
  var current = localStorage.getItem('task_status_'+taskId)||'pending';
  var next = {pending:'done',done:'cancelled',cancelled:'pending'}[current];
  localStorage.setItem('task_status_'+taskId, next);
  loadScheduleForView();
}

// ========== TASK DETAIL ==========
function showTaskDetail(taskId) {
  var found = null;
  DAY_KEYS.forEach(function(dk){
    (allTasks[dk]||[]).forEach(function(t){if(t.id===taskId)found=t;});
  });
  if (!found) return;
  var cls = getTypeClass(found.task_type);
  document.getElementById('sideTaskDetail').innerHTML = 
    '<div style="font-weight:700;color:var(--navy)">'+(found.priority?'⭐️ ':'')+(found.task_custom||found.task_type)+'</div>'+
    '<div style="margin-top:4px">🕐 '+(found.timeStart||'08:00')+'-'+(found.timeEnd||'09:30')+'</div>'+
    (found.ma_ch?'<div>🏪 '+found.ma_ch+' - '+found.ten_ch+'</div>':'')+
    (found.ghi_chu?'<div>📝 '+found.ghi_chu+'</div>':'')+
    '<div style="margin-top:6px"><button onclick="editTaskFromSidebar(\''+taskId+'\')" style="font-size:11px;padding:4px 10px;background:var(--navy);color:#fff;border:none;border-radius:6px;cursor:pointer">✏️ Sửa</button></div>';
}
function editTaskFromSidebar(taskId) {
  var found = null, foundDk = null;
  DAY_KEYS.forEach(function(dk){
    (allTasks[dk]||[]).forEach(function(t){if(t.id===taskId){found=t;foundDk=dk;}});
  });
  if (found && foundDk) openTaskModal(foundDk, taskId, found.timeStart);
}

// ========== COPY PREV WEEK ==========
function copyPrevWeek() {
  var hoTen = document.getElementById('hoTen').value.trim();
  var vaiTro = document.getElementById('vaiTro').value;
  if (!hoTen||!vaiTro) { showToast('Chọn vai trò và tên trước','error'); return; }
  var prevW = currentWeekNum-1, prevY = currentWeekYear;
  if (prevW<1){prevW=52;prevY--;}
  showLoading(true);
  fetchGAS('getSchedule', {ho_ten:hoTen, vai_tro:vaiTro, nam:prevY})
    .then(function(tasks){
      var prevTasks = (tasks||[]).filter(function(t){return String(t.tuan)===String(prevW);});
      if (prevTasks.length===0){showToast('Tuần trước không có task','error');return;}
      var newTasks = prevTasks.map(function(t){
        return {id:'task_'+Date.now()+'_'+Math.random().toString(36).substr(2,6),
          task_type:t.task_type, task_custom:t.task_custom,
          ma_ch:t.ma_ch, ten_ch:t.ten_ch, ghi_chu:t.ghi_chu,
          ho_ten:hoTen, vai_tro:vaiTro, nam:currentWeekYear, tuan:currentWeekNum, ngay:t.ngay};
      });
      return fetchGAS('saveSchedule', {tasks:newTasks});
    })
    .then(function(){loadScheduleForView();showToast('✅ Đã copy tuần '+prevW,'success');})
    .catch(function(e){showToast('❌ Lỗi','error');})
    .finally(function(){showLoading(false);});
}

// ========== NAVIGATION ==========
function goToToday() {
  var now = new Date();
  currentMonth = now.getMonth();
  currentYear = now.getFullYear();
  currentWeekNum = getISOWeekNumber(now);
  currentWeekYear = now.getFullYear();
  loadScheduleForView();
}

// ========== SIDEBAR ==========
function updateSidebar() {
  var allT = []; DAY_KEYS.forEach(function(dk){(allTasks[dk]||[]).forEach(function(t){allT.push(t);});});
  var done=allT.filter(function(t){return t.status==='done'}).length;
  var pri=allT.filter(function(t){return t.priority}).length;
  var priDone=allT.filter(function(t){return t.priority&&t.status==='done'}).length;
  var pct=allT.length>0?Math.round(done/allT.length*100):0;
  document.getElementById('sideStats').innerHTML =
    '<div class="side-stat"><div class="num">'+allT.length+'</div><div class="lab">Tổng việc</div></div>'+
    '<div class="side-stat"><div class="num" style="color:var(--green)">'+pct+'%</div><div class="lab">Hoàn thành</div></div>'+
    '<div class="side-stat"><div class="num">'+pri+'</div><div class="lab">Trọng tâm</div></div>'+
    '<div class="side-stat"><div class="num" style="color:var(--green)">'+priDone+'/'+pri+'</div><div class="lab">TT đã xong</div></div>';
}

// ========== DASHBOARD ==========
function openDashboard() {
  document.getElementById('dashOverlay').classList.add('show');
  loadDashboard();
}
function closeDashboard() {
  document.getElementById('dashOverlay').classList.remove('show');
}
function initDashboardMonthSelects() {
  var now = new Date();
  var cy = now.getFullYear();
  var dashNam = document.getElementById('dashNam');
  if (dashNam.options.length===0) {
    for (var y=cy-1;y<=cy+1;y++){
      var o=document.createElement('option');o.value=y;o.textContent='Năm '+y;
      if(y===cy)o.selected=true;dashNam.appendChild(o);
    }
  }
  var dashTuan = document.getElementById('dashTuan');
  if (dashTuan.options.length===0) {
    for(var w=1;w<=52;w++){
      var o=document.createElement('option');o.value=w;o.textContent='Tuần '+w;dashTuan.appendChild(o);
    }
  }
}
function loadDashboard() {
  var hoTen = document.getElementById('hoTen').value.trim();
  var vaiTro = document.getElementById('vaiTro').value;
  var nam = parseInt(document.getElementById('dashNam').value)||currentYear;
  var tuan = document.getElementById('dashTuan').value;
  showLoading(true);
  fetchGAS('getSchedule', {ho_ten:hoTen||undefined, vai_tro:vaiTro||undefined, nam:nam})
    .then(function(tasks){
      tasks = tasks||[];
      if (tuan) tasks = tasks.filter(function(t){return String(t.tuan)===String(tuan);});
      var people={}, typeCount={}, total=tasks.length;
      tasks.forEach(function(t){
        var p = t.ho_ten+' ('+t.vai_tro+')';
        if(!people[p])people[p]=0; people[p]++;
        var tp = t.task_type==='Khác'?(t.task_custom||'Khác'):t.task_type;
        if(!typeCount[tp])typeCount[tp]=0; typeCount[tp]++;
      });
      var pCount = Object.keys(people).length;
      // KPI
      document.getElementById('dashKpi').innerHTML =
        '<div class="kpi-card"><div class="kpi-val">'+total+'</div><div class="kpi-lab">Tổng đầu việc</div></div>'+
        '<div class="kpi-card"><div class="kpi-val">'+pCount+'</div><div class="kpi-lab">Nhân sự</div></div>'+
        '<div class="kpi-card"><div class="kpi-val">'+(total>0?(localStorage.getItem('done_approx_'+nam)||0):0)+'%</div><div class="kpi-lab">% Hoàn thành</div></div>'+
        '<div class="kpi-card"><div class="kpi-val">'+(tasks.filter(function(t){return t.task_type==='Đào tạo'||t.task_type==='Kiểm tra CH';}).length)+'</div><div class="kpi-lab">⭐️ Việc trọng tâm</div></div>';
      // Bar chart per person
      var bars='<h4>📊 Khối lượng theo nhân sự</h4>';
      Object.keys(people).sort(function(a,b){return people[b]-people[a];}).slice(0,8).forEach(function(p){
        var pct = Math.round(people[p]/Math.max.apply(null,Object.values(people))*100);
        bars+='<div class="bar-row"><div class="bar-label">'+p+'</div><div class="bar-track"><div class="bar-fill navy" style="width:'+pct+'%"></div></div><div class="bar-val">'+people[p]+'</div></div>';
      });
      document.getElementById('dashBars').innerHTML = bars;
      // Table
      var table='<table class="dash-table"><thead><tr><th>Nhân sự</th><th>Số việc</th><th>Loại chính</th></tr></thead><tbody>';
      Object.keys(people).sort(function(a,b){return people[b]-people[a];}).forEach(function(p){
        var mainType=''; var tc={};
        tasks.filter(function(t){return t.ho_ten+' ('+t.vai_tro+')'===p;}).forEach(function(t){var tp=t.task_type;if(!tc[tp])tc[tp]=0;tc[tp]++;});
        var top=Object.entries(tc).sort(function(a,b){return b[1]-a[1];})[0];
        mainType=top?top[0]:'';
        table+='<tr><td>'+p+'</td><td>'+people[p]+'</td><td>'+mainType+'</td></tr>';
      });
      table+='</tbody></table>';
      document.getElementById('dashTopTable').innerHTML = table;
    })
    .finally(function(){showLoading(false);});
}
function exportCSV() {
  var rows=[['Người','Vai trò','Tuần','Ngày','Loại CV','CH','Ghi chú']];
  var hoTen=document.getElementById('hoTen').value.trim();
  var vaiTro=document.getElementById('vaiTro').value;
  var nam=parseInt(document.getElementById('dashNam').value)||currentYear;
  fetchGAS('getSchedule',{ho_ten:hoTen||undefined,vai_tro:vaiTro||undefined,nam:nam})
    .then(function(tasks){
      (tasks||[]).forEach(function(t){rows.push([t.ho_ten,t.vai_tro,t.tuan,t.ngay,t.task_type==='Khác'?(t.task_custom||'Khác'):t.task_type,(t.ma_ch?t.ma_ch+' - '+t.ten_ch:''),t.ghi_chu||'']);});
      var csv='\uFEFF'+rows.map(function(r){return r.map(function(c){return'"'+(c||'').replace(/"/g,'""')+'"';}).join(',');}).join('\n');
      var b=new Blob([csv],{type:'text/csv;charset=utf-8'});
      var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='lich-lam-viec.csv';a.click();
      showToast('✅ Đã xuất CSV','success');
    });
}

// ========== GAS API ==========
function fetchGAS(action, data) {
  return fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(Object.assign({action:action},data||{}))})
    .then(function(r){return r.json();})
    .then(function(res){if(res.success)return res.data;throw new Error(res.error||'Unknown');});
}

function generateId(){return'task_'+Date.now()+'_'+Math.random().toString(36).substr(2,6);}

// ========== UTILS ==========
function getISOWeekNumber(d){var date=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));date.setUTCDate(date.getUTCDate()+4-(date.getUTCDay()||7));var ys=new Date(Date.UTC(date.getUTCFullYear(),0,1));return Math.ceil(((date-ys)/86400000+1)/7);}
function getISOWeekDates(y,w){var j4=new Date(y,0,4);var j4Day=j4.getDay()||7;var w1s=new Date(j4);w1s.setDate(j4.getDate()-(j4Day-1));var mon=new Date(w1s);mon.setDate(w1s.getDate()+(w-1)*7);var sun=new Date(mon);sun.setDate(mon.getDate()+6);return{start:mon,end:sun};}
function isoWeekToDate(y,w,dayIdx){var d=getISOWeekDates(y,w);var r=new Date(d.start);r.setDate(r.getDate()+dayIdx);return r;}
function formatDate(d){return d.getDate()+'/'+(d.getMonth()+1);}
function getTypeClass(type){return TASK_COLORS[type]||'khac';}
function showToast(msg,type){var t=document.getElementById('toast');t.textContent=msg;t.className='toast show '+(type||'');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},2500);}
function showLoading(on){var el=document.getElementById('loading');if(!el){el=document.createElement('div');el.id='loading';el.innerHTML='<div style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:500;background:var(--card);padding:20px 30px;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.15);font-weight:600">⏳ Đang tải...</div>';document.body.appendChild(el);}el.style.display=on?'block':'none';}

// Click outside modal to close

// ESC to close
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeTaskModal();closeDashboard();}});

// ========== DRAG & DROP (basic) ==========
// Allow dragging task badges to change day
var dragTaskId=null;
document.addEventListener('dragstart',function(e){
  if(e.target.classList.contains('month-badge')||e.target.classList.contains('list-item')){
    dragTaskId=e.target.dataset.taskId;e.dataTransfer.effectAllowed='move';
  }
});
document.addEventListener('dragover',function(e){if(dragTaskId){e.preventDefault();e.dataTransfer.dropEffect='move';}});
document.addEventListener('drop',function(e){
  if(!dragTaskId)return;
  var cell=e.target.closest('.month-cell');
  if(cell){
    e.preventDefault();
    var dk = DAY_KEYS[Array.from(cell.parentElement.children).indexOf(cell)%7];
    // Update task day in localStorage + GAS
    DAY_KEYS.forEach(function(d){ (allTasks[d]||[]).forEach(function(t){
      if(t.id===dragTaskId){t.ngay=dk;}
    });});
    loadScheduleForView();showToast('✅ Đã chuyển sang '+DAY_LABELS[DAY_KEYS.indexOf(dk)],'success');
  }
  dragTaskId=null;
});
