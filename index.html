<!DOCTYPE html>
<html lang="vi">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Khai Báo Lịch Làm Việc</title>
<style>
:root{
  --red:#d71920; --navy:#1a3c6e; --gold:#ffc107; --green:#1e8e4e;
  --bg:#f4f6fb; --card:#ffffff; --line:#e5e9f2; --txt:#1c2434; --mut:#6b7280;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
  font-family:'Be Vietnam Pro',system-ui,sans-serif;
  background:var(--bg);color:var(--txt);min-height:100vh;padding:16px 16px 100px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:560px;margin:0 auto}

/* Header */
.header{
  background:linear-gradient(135deg,var(--navy),#2c4a8a);
  color:#fff;border-radius:16px;padding:18px 20px 20px;
  box-shadow:0 8px 24px rgba(26,60,110,.18);margin-bottom:14px;
  position:static;
}
.header h1{font-size:16px;font-weight:800;line-height:1.3;letter-spacing:0}
.header .logo-area svg{width:24px;height:24px}
.header .logo-area{display:flex;align-items:center;gap:8px}
.header .version-tag{display:inline-block;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:600;margin-top:8px}

/* Tab nav */
.tab-nav{
  display:flex;gap:6px;margin-bottom:14px;background:none;border:none;
  position:static;z-index:auto;
}
.tab-nav button{
  flex:1;padding:11px 8px;border:none;border-radius:10px;
  font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;
  background:var(--card);color:var(--mut);border:1.5px solid var(--line);
  transition:.15s;
}
.tab-nav button.active{background:var(--navy);color:#fff;border-color:var(--navy)}

/* Card */
.form-section, .card{
  background:var(--card);border-radius:14px;padding:18px;margin-bottom:14px;
  box-shadow:0 2px 10px rgba(20,30,60,.06);border:1px solid var(--line);
}
.form-section h2, .card h2{
  font-size:14px;font-weight:700;color:var(--navy);margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.form-section h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--red);flex-shrink:0;margin-top:2px}

/* Form */
label{font-size:11.5px;font-weight:600;color:var(--mut);display:block;margin:10px 0 5px}
label:first-child{margin-top:0}
input,select,textarea{
  width:100%;font-size:14px;font-family:inherit;padding:10px 11px;
  border:1.5px solid var(--line);border-radius:10px;background:#fafbfd;color:var(--txt);
  outline:none;transition:border .15s;
}
input:focus,select:focus{border-color:var(--navy);background:#fff}
.form-row{display:flex;gap:8px}
.form-row>div{flex:1;min-width:0}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:13px 16px;border-radius:12px;border:none;font-size:13.5px;font-weight:700;
  cursor:pointer;transition:opacity .15s,transform .05s;font-family:inherit
}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--red);color:#fff;box-shadow:0 6px 18px rgba(215,25,32,.3)}
.btn-secondary{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn-sm{padding:8px 14px;font-size:12px}
.btn-bar{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}

/* Week grid */
.week-grid{display:flex;flex-direction:column;gap:10px}
.day-card{
  border:1.5px solid var(--line);border-radius:10px;overflow:hidden;
  background:#fafbfd;transition:border .15s;
}
.day-card.today{border-color:var(--red);background:#fff5f5}
.day-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 14px;background:#eef3fb;font-weight:700;font-size:13px;color:var(--navy);
}
.day-card.today .day-header{background:var(--red);color:#fff}
.date-num{font-size:12px;font-weight:600;opacity:.8}
.day-tasks{padding:8px 12px;min-height:40px;display:flex;flex-wrap:wrap;gap:6px}
.add-task-btn{
  margin:8px 12px 12px;padding:8px 14px;background:none;color:var(--navy);
  border:1.5px dashed var(--line);border-radius:8px;font-size:12px;font-weight:600;
  cursor:pointer;font-family:inherit;width:calc(100% - 24px);text-align:center;
}
.add-task-btn:active{background:#eef3fb}

/* Task chips */
.task-chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 10px;border-radius:8px;font-size:12px;font-weight:600;
  background:#eef3fb;color:var(--navy);cursor:pointer;position:relative;
  border:1px solid #d8e3f3;max-width:100%;
}
.task-chip .task-type{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-chip .task-ch{font-size:10px;font-weight:500;color:var(--mut)}
.task-chip .task-note{font-size:10px;font-style:italic;color:var(--mut)}
.chip-actions{display:flex;gap:2px;margin-left:auto}
.chip-actions button{
  background:none;border:none;cursor:pointer;padding:2px 4px;font-size:12px;
  border-radius:4px;line-height:1;
}
.chip-actions .edit-btn:active{background:#d8e3f3}
.chip-actions .del-btn:active{background:#fdeeee}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;
  display:flex;align-items:flex-end;justify-content:center;
}
.modal{
  background:#fff;border-radius:18px 18px 0 0;padding:20px;width:100%;max-width:560px;
  max-height:90vh;overflow-y:auto;box-shadow:0 -4px 20px rgba(0,0,0,.15);
}
.modal h3{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:14px}
.form-group{margin-bottom:12px}
.form-group label{font-size:11.5px;font-weight:600;color:var(--mut);display:block;margin-bottom:5px}
.store-search-wrap{position:relative}
.store-search-wrap input{padding-right:36px}
.clear-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:16px;cursor:pointer;color:var(--mut)}
.store-dropdown{position:absolute;top:100%;left:0;right:0;max-height:200px;overflow-y:auto;background:#fff;border:1.5px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.1);z-index:10;display:none}
.store-dropdown .store-opt{padding:10px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid #f0f0f0}
.store-dropdown .store-opt:last-child{border:none}
.store-dropdown .store-opt:active{background:#eef3fb}

/* Dashboard */
.dashboard-filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.filter-group{flex:1;min-width:120px}
.filter-group label{font-size:11px;margin-bottom:3px}
.filter-group input, .filter-group select{padding:8px 10px;font-size:13px}
.view-toggle.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.dashboard-view{margin-top:14px}
.empty-state{text-align:center;padding:30px 16px;color:var(--mut);font-size:13px}

/* Table */
.data-table{width:100%;border-collapse:collapse;font-size:12px}
.data-table th{background:#eef3fb;padding:8px 6px;font-weight:700;color:var(--navy);text-align:left;white-space:nowrap;position:sticky;top:0}
.data-table td{padding:7px 6px;border-bottom:1px solid var(--line)}
.data-table tr:nth-child(even){background:#fafbfd}

/* Summary bar */
.summary-bar{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.summary-item{flex:1;min-width:60px;padding:10px 12px;border-radius:10px;background:#eef3fb;text-align:center}
.summary-item .num{font-size:18px;font-weight:800;color:var(--navy)}
.summary-item .lbl{font-size:10px;color:var(--mut);margin-top:2px}

/* Toast */
.toast{
  position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:300;
  padding:12px 20px;border-radius:12px;font-size:13px;font-weight:700;color:#fff;
  box-shadow:0 6px 20px rgba(0,0,0,.15);max-width:90%;
}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}

/* Loading */
.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.8);z-index:150;display:flex;align-items:center;justify-content:center}
.spinner{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--navy);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Timeline */
.timeline-entry{margin-bottom:8px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:#fafbfd}
.timeline-entry .t-date{font-size:11px;font-weight:600;color:var(--mut);margin-bottom:4px}
.timeline-entry .t-person{font-size:13px;font-weight:700;color:var(--navy)}
.timeline-entry .t-task{font-size:12px;color:var(--txt);margin-top:2px}
.timeline-entry .t-store{font-size:11px;color:var(--mut);margin-top:2px}

/* Misc */
#weekLabel{color:var(--red);font-weight:700}
#customTaskWrap{display:none}
</style>
</head>

<script>
// ========== CONFIG ==========
var GAS_URL = 'https://script.google.com/macros/s/AKfycbwPmh_Erk9eDbpNCMQePscfl067merQamb1xfvKbtjyUmjw3jTUU4Z43LzziuQb7H1X/exec';

// ========== STATE ==========
var weekTasks = {}; // { 'T2': [task, ...], 'T3': [...], ... }
var storelistCache = [];
var currentEditDay = null;
var currentEditTaskId = null;
var DAY_KEYS = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'];
var DAY_LABELS = ['Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7', 'Chủ Nhật'];
var WEEK_DATES = {}; // date strings for each day

// ========== INITIALIZATION ==========
document.addEventListener('DOMContentLoaded', function() {
  initTabs();
  initWeekSelects(); loadGdvList();
  initViewToggle();
  initTaskTypeChange();
  initStoreSearch();
  loadStorelist();
});

function initTabs() {
  document.querySelectorAll('.tab-nav button').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.tab-nav button').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      var tabId = btn.dataset.tab;
      document.querySelectorAll('.tab-content').forEach(function(tc) { tc.classList.remove('active'); });
      document.getElementById('tab-' + tabId).classList.add('active');
      if (tabId === 'dashboard') {
        initDashboardMonthSelects();
      }
    });
  });
}

function initViewToggle() {
  document.querySelectorAll('.view-toggle').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.view-toggle').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      var view = btn.dataset.view;
      document.getElementById('timelineView').style.display = view === 'timeline' ? '' : 'none';
      document.getElementById('tableView').style.display = view === 'table' ? '' : 'none';
    });
  });
}

// ========== YEAR / WEEK (ISO) ==========
var GDV_LIST = [];

function loadGdvList() {
  var sel = document.getElementById('hoTen');
  
  // Always add GĐM option first
  var gdmOpt = document.createElement('option');
  gdmOpt.value = 'GĐM';
  gdmOpt.textContent = 'GĐM (Giám đốc Miền)';
  sel.appendChild(gdmOpt);
  
  if (!GAS_URL) {
    showToast('⚠️ Chưa cấu hình GAS URL', 'error');
    return;
  }
  
  fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'action=getGdvList&data=' + encodeURIComponent('{}')
  })
    .then(function(r) { return r.json(); })
    .then(function(result) {
      if (!result.success || !result.data) return;
      result.data.forEach(function(gdv) {
        GDV_LIST.push(gdv);
        var opt = document.createElement('option');
        opt.value = gdv.ho_ten;
        opt.textContent = gdv.ho_ten + ' (' + gdv.vai_tro + ')';
        sel.appendChild(opt);
      });
    })
    .catch(function(e) { console.warn('loadGdvList error:', e); });
}

function sortSelect(sel) {
  var opts = Array.from(sel.options);
  opts.sort(function(a, b) { 
    if (!a.value) return -1;
    if (!b.value) return 1;
    return a.textContent.localeCompare(b.textContent, 'vi'); 
  });
  sel.innerHTML = '';
  opts.forEach(function(o) { sel.appendChild(o); });
}

function getISOWeekDates(year, week) {
  // Get Monday of ISO week
  var jan4 = new Date(year, 0, 4);
  var jan4Day = jan4.getDay() || 7;
  var week1Start = new Date(jan4);
  week1Start.setDate(jan4.getDate() - (jan4Day - 1));
  
  var monday = new Date(week1Start);
  monday.setDate(week1Start.getDate() + (week - 1) * 7);
  
  var sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  
  return { start: monday, end: sunday };
}

function getISOWeekNumber(d) {
  var date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  date.setUTCDate(date.getUTCDate() + 4 - (date.getUTCDay() || 7));
  var yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
  return Math.ceil(((date - yearStart) / 86400000 + 1) / 7);
}

function initWeekSelects() {
  var now = new Date();
  var currentYear = now.getFullYear();
  var currentWeek = getISOWeekNumber(now);

  // Năm
  var namSelect = document.getElementById('nam');
  for (var y = currentYear - 1; y <= currentYear + 1; y++) {
    var opt = document.createElement('option');
    opt.value = y;
    opt.textContent = 'Năm ' + y;
    if (y === currentYear) opt.selected = true;
    namSelect.appendChild(opt);
  }

  namSelect.addEventListener('change', updateWeekSelect);
  updateWeekSelect();
}

function updateWeekSelect() {
  var nam = parseInt(document.getElementById('nam').value);
  var tuanSelect = document.getElementById('tuan');
  tuanSelect.innerHTML = '<option value="">-- Chọn tuần --</option>';

  if (!nam) return;

  var now = new Date();
  var currentWeek = getISOWeekNumber(now);
  var currentYear = now.getFullYear();

  // Show all 52 weeks of year
  for (var w = 1; w <= 52; w++) {
    var dates = getISOWeekDates(nam, w);
    var startStr = formatDate(dates.start);
    var endStr = formatDate(dates.end);
    var opt = document.createElement('option');
    opt.value = w;
    opt.textContent = 'W' + String(w).padStart(2, '0') + ' (' + startStr + ' - ' + endStr + ')';
    if (nam === currentYear && w === currentWeek) opt.selected = true;
    tuanSelect.appendChild(opt);
  }

  tuanSelect.addEventListener('change', onWeekSelected);
  // Auto-select current week
  if (nam === currentYear) {
    tuanSelect.value = currentWeek;
    onWeekSelected();
  }
}

function onWeekSelected() {
  var tuan = parseInt(document.getElementById('tuan').value);
  var nam = parseInt(document.getElementById('nam').value);

  if (!tuan || !nam) {
    document.getElementById('weekGridSection').style.display = 'none';
    document.getElementById('summarySection').style.display = 'none';
    return;
  }

  var dates = getISOWeekDates(nam, tuan);
  WEEK_DATES = {};
  var d = new Date(dates.start);
  for (var i = 0; i < 7; i++) {
    WEEK_DATES[DAY_KEYS[i]] = formatDate(d);
    d.setDate(d.getDate() + 1);
  }

  document.getElementById('weekLabel').textContent = 'W' + String(tuan).padStart(2, '0') + ' (' + nam + ') : ' + formatDate(dates.start) + ' - ' + formatDate(dates.end);
  document.getElementById('weekGridSection').style.display = '';
  document.getElementById('summarySection').style.display = '';

  weekTasks = {};
  DAY_KEYS.forEach(function(dk) { weekTasks[dk] = []; });

  renderWeekGrid();
  loadExistingSchedule();
}

function formatDate(d) {
  var dd = String(d.getDate()).padStart(2, '0');
  var mm = String(d.getMonth() + 1).padStart(2, '0');
  return dd + '/' + mm + '/' + d.getFullYear();
}

// ========== WEEK GRID ==========
function renderWeekGrid() {
  var grid = document.getElementById('weekGrid');
  grid.innerHTML = '';

  var today = new Date();
  var todayStr = formatDate(today);

  DAY_KEYS.forEach(function(dk, i) {
    var dateStr = WEEK_DATES[dk] || '';
    var isToday = (dateStr === todayStr);

    var card = document.createElement('div');
    card.className = 'day-card' + (isToday ? ' today' : '');

    var header = document.createElement('div');
    header.className = 'day-header';
    header.innerHTML = '<span>' + DAY_LABELS[i] + '</span><span class="date-num">' + dateStr + '</span>';
    card.appendChild(header);

    var tasksDiv = document.createElement('div');
    tasksDiv.className = 'day-tasks';
    tasksDiv.id = 'tasks-' + dk;
    card.appendChild(tasksDiv);

    var addBtn = document.createElement('button');
    addBtn.className = 'add-task-btn';
    addBtn.innerHTML = '+ Thêm công việc';
    addBtn.onclick = function() { openTaskModal(dk, null); };
    card.appendChild(addBtn);

    grid.appendChild(card);
  });

  renderAllDayTasks();
}

function renderAllDayTasks() {
  DAY_KEYS.forEach(function(dk) {
    renderDayTasks(dk);
  });
  updateSummary();
}

function renderDayTasks(dk) {
  var container = document.getElementById('tasks-' + dk);
  if (!container) return;
  container.innerHTML = '';

  var tasks = weekTasks[dk] || [];
  tasks.forEach(function(task, idx) {
    var chip = document.createElement('div');
    chip.className = 'task-chip';

    var typeLabel = task.task_type === 'Khác' ? (task.task_custom || 'Khác') : task.task_type;
    var html = '<div class="task-type">' + escapeHtml(typeLabel) + '</div>';
    if (task.ma_ch || task.ten_ch) {
      html += '<div class="task-ch">🏪 ' + escapeHtml(task.ma_ch + ' - ' + task.ten_ch) + '</div>';
    }
    if (task.ghi_chu) {
      html += '<div class="task-note">' + escapeHtml(task.ghi_chu) + '</div>';
    }
    html += '<div class="chip-actions">';
    html += '<button class="edit-btn" title="Sửa" onclick="event.stopPropagation();openTaskModal(\'' + dk + '\',\'' + task.id + '\')">✏️</button>';
    html += '<button class="del-btn" title="Xóa" onclick="event.stopPropagation();deleteLocalTask(\'' + dk + '\',\'' + task.id + '\')">🗑</button>';
    html += '</div>';
    chip.innerHTML = html;
    chip.onclick = function() { openTaskModal(dk, task.id); };
    container.appendChild(chip);
  });
}

function updateSummary() {
  var total = 0;
  var summaryHtml = '';
  DAY_KEYS.forEach(function(dk) {
    var count = (weekTasks[dk] || []).length;
    total += count;
    if (count > 0) {
      summaryHtml += '<div class="summary-item"><div class="num">' + count + '</div><div class="label">' + DAY_LABELS[DAY_KEYS.indexOf(dk)] + '</div></div>';
    }
  });
  if (total === 0) {
    summaryHtml = '<div class="summary-item"><div class="num">0</div><div class="label">Tổng task</div></div>';
  } else {
    summaryHtml = '<div class="summary-item"><div class="num">' + total + '</div><div class="label">Tổng task</div></div>' + summaryHtml;
  }
  document.getElementById('summaryBar').innerHTML = summaryHtml;
}

function deleteLocalTask(dk, taskId) {
  if (!confirm('Xóa task này?')) return;
  weekTasks[dk] = (weekTasks[dk] || []).filter(function(t) { return t.id !== taskId; });
  renderDayTasks(dk);
  updateSummary();
}

// ========== TASK MODAL ==========
function openTaskModal(dk, taskId) {
  currentEditDay = dk;
  currentEditTaskId = taskId;

  var title = document.getElementById('modalTitle');
  var typeSelect = document.getElementById('modalTaskType');
  var customInput = document.getElementById('modalTaskCustom');
  var customWrap = document.getElementById('customTaskWrap');
  var storeSearch = document.getElementById('modalStoreSearch');
  var maCH = document.getElementById('modalMaCH');
  var tenCH = document.getElementById('modalTenCH');
  var ghiChu = document.getElementById('modalGhiChu');
  var taskIdInput = document.getElementById('modalTaskId');

  document.getElementById('modalStoreDropdown').classList.remove('show');

  if (taskId) {
    // Edit mode
    var tasks = weekTasks[dk] || [];
    var task = tasks.find(function(t) { return t.id === taskId; });
    if (task) {
      title.textContent = '✏️ Sửa task - ' + DAY_LABELS[DAY_KEYS.indexOf(dk)];
      typeSelect.value = task.task_type || '';
      customInput.value = task.task_custom || '';
      maCH.value = task.ma_ch || '';
      tenCH.value = task.ten_ch || '';
      storeSearch.value = task.ma_ch ? task.ma_ch + ' - ' + task.ten_ch : '';
      ghiChu.value = task.ghi_chu || '';
      taskIdInput.value = task.id;
      customWrap.style.display = (task.task_type === 'Khác') ? '' : 'none';
    }
  } else {
    // Add mode
    title.textContent = '➕ Thêm task - ' + DAY_LABELS[DAY_KEYS.indexOf(dk)];
    typeSelect.value = '';
    customInput.value = '';
    maCH.value = '';
    tenCH.value = '';
    storeSearch.value = '';
    ghiChu.value = '';
    taskIdInput.value = '';
    customWrap.style.display = 'none';
  }

  document.getElementById('taskModal').style.display = '';
}

function closeTaskModal() {
  document.getElementById('taskModal').style.display = 'none';
  currentEditDay = null;
  currentEditTaskId = null;
}

function initTaskTypeChange() {
  document.getElementById('modalTaskType').addEventListener('change', function() {
    document.getElementById('customTaskWrap').style.display = this.value === 'Khác' ? '' : 'none';
    if (this.value !== 'Khác') {
      document.getElementById('modalTaskCustom').value = '';
    }
  });
}

function saveTask() {
  var dk = currentEditDay;
  if (!dk) return;

  var type = document.getElementById('modalTaskType').value;
  var custom = document.getElementById('modalTaskCustom').value.trim();
  var ma = document.getElementById('modalMaCH').value.trim();
  var ten = document.getElementById('modalTenCH').value.trim();
  var ghiChu = document.getElementById('modalGhiChu').value.trim();
  var taskId = document.getElementById('modalTaskId').value;

  if (!type) { showToast('Vui lòng chọn loại công việc', 'error'); return; }
  if (type === 'Khác' && !custom) { showToast('Vui lòng mô tả công việc', 'error'); return; }

  if (!weekTasks[dk]) weekTasks[dk] = [];

  var task = {
    id: taskId || generateId(),
    task_type: type,
    task_custom: type === 'Khác' ? custom : '',
    ma_ch: ma,
    ten_ch: ten,
    ghi_chu: ghiChu
  };

  if (taskId) {
    // Update existing
    var idx = weekTasks[dk].findIndex(function(t) { return t.id === taskId; });
    if (idx >= 0) {
      weekTasks[dk][idx] = task;
    }
  } else {
    // Add new
    weekTasks[dk].push(task);
  }

  closeTaskModal();
  renderDayTasks(dk);
  updateSummary();
  showToast('✅ Đã lưu task', 'success');
}

function generateId() {
  return 'task_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
}

// ========== STORE SEARCH ==========
function initStoreSearch() {
  var input = document.getElementById('modalStoreSearch');
  var dropdown = document.getElementById('modalStoreDropdown');

  input.addEventListener('input', function() {
    filterStoreDropdown(this.value);
  });

  input.addEventListener('focus', function() {
    filterStoreDropdown(this.value);
  });

  document.addEventListener('click', function(e) {
    if (!e.target.closest('.store-search-wrap')) {
      dropdown.classList.remove('show');
    }
  });
}

function loadStorelist() {
  if (!GAS_URL) {
    // Load from embedded storelist or use cached
    storelistCache = [];
    return;
  }
  showLoading(true);
  fetch(GAS_URL + '?action=getStorelist', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ search: '' })
  })
  .then(function(r) { return r.json(); })
  .then(function(res) {
    if (res.success) {
      storelistCache = res.data || [];
    }
  })
  .catch(function(err) {
    console.warn('Storelist load error (will retry on search):', err);
    storelistCache = [];
  })
  .finally(function() { showLoading(false); });
}

function filterStoreDropdown(query) {
  var dropdown = document.getElementById('modalStoreDropdown');
  query = (query || '').toLowerCase().trim();

  if (!GAS_URL) {
    dropdown.innerHTML = '<div class="no-result">⚠️ Chưa cấu hình GAS_URL. Cần deploy GAS backend.</div>';
    dropdown.classList.add('show');
    return;
  }

  showLoading(true);
  fetch(GAS_URL + '?action=getStorelist&search=' + encodeURIComponent(query), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ search: query })
  })
  .then(function(r) { return r.json(); })
  .then(function(res) {
    if (res.success && res.data && res.data.length > 0) {
      var html = '';
      res.data.forEach(function(s) {
        html += '<div class="item" data-ma="' + escapeHtml(s.ma_sap) + '" data-ten="' + escapeHtml(s.ten_ch) + '" onclick="selectStore(this)">';
        html += '<span class="ma">' + escapeHtml(s.ma_sap) + '</span>';
        html += '<span class="ten">' + escapeHtml(s.ten_ch) + '</span>';
        html += '</div>';
      });
      dropdown.innerHTML = html;
    } else {
      dropdown.innerHTML = '<div class="no-result">Không tìm thấy cửa hàng</div>';
    }
    dropdown.classList.add('show');
  })
  .catch(function(err) {
    dropdown.innerHTML = '<div class="no-result">Lỗi tải danh sách CH</div>';
    dropdown.classList.add('show');
  })
  .finally(function() { showLoading(false); });
}

function selectStore(el) {
  var ma = el.dataset.ma;
  var ten = el.dataset.ten;
  document.getElementById('modalStoreSearch').value = ma + ' - ' + ten;
  document.getElementById('modalMaCH').value = ma;
  document.getElementById('modalTenCH').value = ten;
  document.getElementById('modalStoreDropdown').classList.remove('show');
}

function clearStoreSelection() {
  document.getElementById('modalStoreSearch').value = '';
  document.getElementById('modalMaCH').value = '';
  document.getElementById('modalTenCH').value = '';
  document.getElementById('modalStoreDropdown').classList.remove('show');
}

// ========== SAVE / LOAD ==========
function validateBeforeSave() {
  var vaiTro = document.getElementById('vaiTro').value;
  var hoTen = document.getElementById('hoTen').value.trim();
  var tuan = document.getElementById('tuan').value;
  

  if (!vaiTro) { showToast('Vui lòng chọn vai trò', 'error'); return false; }
  if (!hoTen) { showToast('Vui lòng nhập họ tên', 'error'); return false; }
  if (!tuan) { showToast('Vui lòng chọn tuần', 'error'); return false; }
  // thang removed - using year+week only
  return true;
}

function saveWeek() {
  if (!validateBeforeSave()) return;
  if (!GAS_URL) { showToast('⚠️ Chưa cấu hình GAS_URL. Lịch chỉ lưu tạm trên trình duyệt.', 'error'); return; }

  var hoTen = document.getElementById('hoTen').value.trim();
  var vaiTro = document.getElementById('vaiTro').value;
  
  var tuan = document.getElementById('tuan').value;

  var tasks = [];
  DAY_KEYS.forEach(function(dk) {
    (weekTasks[dk] || []).forEach(function(t) {
      tasks.push({
        id: t.id,
        ho_ten: hoTen,
        vai_tro: vaiTro,
        nam: nam,
        tuan: tuan,
        ngay: dk,
        task_type: t.task_type,
        task_custom: t.task_custom || '',
        ma_ch: t.ma_ch || '',
        ten_ch: t.ten_ch || '',
        ghi_chu: t.ghi_chu || ''
      });
    });
  });

  if (tasks.length === 0) {
    if (!confirm('Tuần này không có task nào. Bạn muốn lưu lịch trống (xóa các task cũ của tuần này)?')) return;
  }

  showLoading(true);
  fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'saveSchedule', tasks: tasks })
  })
  .then(function(r) { return r.json(); })
  .then(function(res) {
    if (res.success) {
      showToast('✅ ' + res.message, 'success');
    } else {
      showToast('❌ Lỗi: ' + (res.error || 'Không xác định'), 'error');
    }
  })
  .catch(function(err) {
    showToast('❌ Lỗi kết nối: ' + err.message, 'error');
  })
  .finally(function() { showLoading(false); });
}

function loadExistingSchedule() {
  if (!GAS_URL) return;

  var hoTen = document.getElementById('hoTen').value.trim();
  
  var tuan = document.getElementById('tuan').value;
  if (!hoTen || !tuan) return;

  showLoading(true);
  fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      action: 'getSchedule',
      ho_ten: hoTen,
      nam: nam,
      tuan: tuan
    })
  })
  .then(function(r) { return r.json(); })
  .then(function(res) {
    if (res.success && res.data && res.data.length > 0) {
      // Reset grid first
      DAY_KEYS.forEach(function(dk) { weekTasks[dk] = []; });
      res.data.forEach(function(t) {
        var dk = t.ngay;
        if (DAY_KEYS.indexOf(dk) >= 0) {
          weekTasks[dk].push({
            id: t.id,
            task_type: t.task_type,
            task_custom: t.task_custom || '',
            ma_ch: t.ma_ch || '',
            ten_ch: t.ten_ch || '',
            ghi_chu: t.ghi_chu || ''
          });
        }
      });
      renderAllDayTasks();
      showToast('📋 Đã tải ' + res.data.length + ' task từ lịch cũ — sửa/xóa thoải mái rồi Lưu nhé!', 'success');
    }
  })
  .catch(function(err) {
    console.warn('Load schedule error:', err);
  })
  .finally(function() { showLoading(false); });
}

function resetForm() {
  if (!confirm('Xóa tất cả task đã thêm trong tuần này?')) return;
  DAY_KEYS.forEach(function(dk) { weekTasks[dk] = []; });
  renderAllDayTasks();
  showToast('Đã reset lịch tuần', 'success');
}

// ========== DASHBOARD ==========
function initDashboardMonthSelects() {
  var now = new Date();
  var currentYear = now.getFullYear();
  var currentMonth = now.getMonth() + 1;

  var dashNam = document.getElementById('dashNam');
  if (dashNam.options.length === 0) {
    for (var y = currentYear - 1; y <= currentYear + 1; y++) {
      var opt = document.createElement('option');
      opt.value = y;
      opt.textContent = 'Năm ' + y;
      if (y === currentYear) opt.selected = true;
      dashNam.appendChild(opt);
    }
  }

    for (var m = 1; m <= 12; m++) {
      var opt = document.createElement('option');
      opt.value = m;
      opt.textContent = 'Tháng ' + m;
      if (m === currentMonth) opt.selected = true;
    }
  }
}

function loadDashboard() {
  if (!GAS_URL) {
    document.getElementById('timelineView').innerHTML = '<div class="empty-state"><p>⚠️ Chưa cấu hình GAS_URL</p></div>';
    document.getElementById('tableView').innerHTML = '<div class="empty-state"><p>⚠️ Chưa cấu hình GAS_URL</p></div>';
    return;
  }

  var vaiTro = document.getElementById('dashVaiTro').value;
  var hoTen = document.getElementById('dashNguoi').value.trim();

  showLoading(true);
  fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      action: 'getSchedule',
      vai_tro: vaiTro || undefined,
      nam: nam || undefined,
      ho_ten: hoTen || undefined
    })
  })
  .then(function(r) { return r.json(); })
  .then(function(res) {
    if (res.success) {
      renderDashboard(res.data);
    } else {
      showToast('❌ Lỗi: ' + (res.error || 'Không xác định'), 'error');
    }
  })
  .catch(function(err) {
    showToast('❌ Lỗi kết nối: ' + err.message, 'error');
  })
  .finally(function() { showLoading(false); });
}

function renderDashboard(data) {
  // Summary
  var people = {};
  var taskCount = 0;
  data.forEach(function(t) {
    taskCount++;
    var key = t.ho_ten + ' (' + t.vai_tro + ')';
    if (!people[key]) people[key] = 0;
    people[key]++;
  });

  var summaryHtml = '<div class="summary-item"><div class="num">' + Object.keys(people).length + '</div><div class="label">Người</div></div>';
  summaryHtml += '<div class="summary-item"><div class="num">' + taskCount + '</div><div class="label">Tổng task</div></div>';
  document.getElementById('dashSummary').innerHTML = summaryHtml;

  // Timeline view
  renderTimelineView(data);

  // Table view
  renderTableView(data);
}

function renderTimelineView(data) {
  var container = document.getElementById('timelineView');
  if (!data || data.length === 0) {
    container.innerHTML = '<div class="empty-state"><p>Không có dữ liệu</p></div>';
    return;
  }

  // Group by person, then week, then day
  var grouped = {};
  data.forEach(function(t) {
    var person = t.ho_ten + ' (' + t.vai_tro + ')';
    if (!grouped[person]) grouped[person] = {};
    var weekKey = 'W' + String(t.tuan).padStart(2,'0') + ' (' + t.nam + ')';
    if (!grouped[person][weekKey]) grouped[person][weekKey] = {};
    if (!grouped[person][weekKey][t.ngay]) grouped[person][weekKey][t.ngay] = [];
    grouped[person][weekKey][t.ngay].push(t);
  });

  var html = '';
  Object.keys(grouped).sort().forEach(function(person) {
    html += '<div style="margin-bottom:16px;">';
    html += '<h3 style="font-size:15px;color:var(--red-dark);margin-bottom:8px;">👤 ' + escapeHtml(person) + '</h3>';
    Object.keys(grouped[person]).sort().forEach(function(wk) {
      html += '<div style="font-weight:600;font-size:13px;margin:8px 0 4px;">📅 ' + escapeHtml(wk) + '</div>';
      var days = grouped[person][wk];
      DAY_KEYS.forEach(function(dk) {
        if (days[dk] && days[dk].length > 0) {
          var dateStr = '';
          days[dk].forEach(function(t) {
            // Try to find date from task
            if (t.created_at) dateStr = t.created_at;
          });
          html += '<div class="timeline-row">';
          html += '<div class="timeline-day">' + DAY_LABELS[DAY_KEYS.indexOf(dk)] + '</div>';
          html += '<div class="timeline-content"><div class="timeline-tasks">';
          days[dk].forEach(function(t) {
            var typeLabel = t.task_type === 'Khác' ? (t.task_custom || 'Khác') : t.task_type;
            html += '<div class="timeline-task">';
            html += '<span class="tl-type">' + getTaskBadge(t.task_type, typeLabel) + '</span>';
            if (t.ma_ch) html += '<span class="tl-ch">🏪 ' + escapeHtml(t.ma_ch + ' - ' + t.ten_ch) + '</span>';
            if (t.ghi_chu) html += '<span class="tl-note">' + escapeHtml(t.ghi_chu) + '</span>';
            html += '</div>';
          });
          html += '</div></div></div>';
        }
      });
    });
    html += '</div>';
  });

  container.innerHTML = html;
}

function renderTableView(data) {
  var container = document.getElementById('tableView');
  if (!data || data.length === 0) {
    container.innerHTML = '<div class="empty-state"><p>Không có dữ liệu</p></div>';
    return;
  }

  var html = '<table class="schedule-table"><thead><tr>';
  html += '<th>Người</th><th>Vai trò</th><th>Tháng</th><th>Tuần</th><th>Ngày</th><th>Loại CV</th><th>CH</th><th>Ghi chú</th>';
  html += '</tr></thead><tbody>';

  // Sort by person, month, week, day
  var DAY_ORDER = { 'T2': 0, 'T3': 1, 'T4': 2, 'T5': 3, 'T6': 4, 'T7': 5, 'CN': 6 };
  data.sort(function(a, b) {
    return (a.ho_ten || '').localeCompare(b.ho_ten || '') ||
      (a.nam || 0) - (b.nam || 0) || (a.tuan || 0) - (b.tuan || 0) ||
      (a.tuan || 0) - (b.tuan || 0) ||
      (DAY_ORDER[a.ngay] || 0) - (DAY_ORDER[b.ngay] || 0);
  });

  data.forEach(function(t) {
    var typeLabel = t.task_type === 'Khác' ? (t.task_custom || 'Khác') : t.task_type;
    html += '<tr>';
    html += '<td>' + escapeHtml(t.ho_ten) + '</td>';
    html += '<td>' + escapeHtml(t.vai_tro) + '</td>';
    html += '<td>' + escapeHtml(t.nam) + '</td>';
    html += '<td>' + escapeHtml(t.tuan) + '</td>';
    html += '<td>' + escapeHtml(t.ngay) + '</td>';
    html += '<td>' + getTaskBadge(t.task_type, typeLabel) + '</td>';
    html += '<td>' + escapeHtml(t.ma_ch ? t.ma_ch + ' - ' + t.ten_ch : '') + '</td>';
    html += '<td style="font-size:11px;color:#888;">' + escapeHtml(t.ghi_chu || '') + '</td>';
    html += '</tr>';
  });

  html += '</tbody></table>';
  container.innerHTML = html;
}

function getTaskBadge(type, label) {
  var cls = 'badge-khac';
  switch (type) {
    case 'Họp team': cls = 'badge-hop'; break;
    case 'Kiểm tra CH': cls = 'badge-kiemtra'; break;
    case 'Đào tạo': cls = 'badge-daotao'; break;
    case 'Tuyển dụng': cls = 'badge-tuyendung'; break;
    case 'Báo cáo': cls = 'badge-baocao'; break;
    case 'Đi thị trường': cls = 'badge-ditruong'; break;
    case 'Khảo sát NSO': cls = 'badge-khaosat'; break;
    case 'Họp đối tác': cls = 'badge-hopdt'; break;
  }
  return '<span class="task-badge ' + cls + '">' + escapeHtml(label) + '</span>';
}

function exportDashboard() {
  // Get current table data and export as CSV
  var table = document.querySelector('#tableView table');
  if (!table) { showToast('Không có dữ liệu để xuất', 'error'); return; }

  var rows = table.querySelectorAll('tr');
  var csv = [];
  rows.forEach(function(row) {
    var cols = row.querySelectorAll('th, td');
    var rowData = [];
    cols.forEach(function(col) {
      var text = col.textContent.trim();
      text = text.replace(/"/g, '""');
      rowData.push('"' + text + '"');
    });
    csv.push(rowData.join(','));
  });

  var BOM = '\uFEFF';
  var blob = new Blob([BOM + csv.join('\n')], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'lich-lam-viec_' + new Date().toISOString().split('T')[0] + '.csv';
  a.click();
  URL.revokeObjectURL(url);
  showToast('✅ Đã xuất file CSV', 'success');
}

// ========== UTILITIES ==========
function showToast(msg, type) {
  var toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast show ' + (type || '');
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(function() { toast.classList.remove('show'); }, 2500);
}

function showLoading(on) {
  document.getElementById('loading').style.display = on ? '' : 'none';
}

function escapeHtml(str) {
  if (!str) return '';
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ========== KEYBOARD SHORTCUTS ==========
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    if (document.getElementById('taskModal').style.display !== 'none') {
      closeTaskModal();
    }
  }
});

// Click outside modal to close
document.getElementById('taskModal').addEventListener('click', function(e) {
  if (e.target === this) closeTaskModal();
});
